spring:
  application:
    name: car-parts-store

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      pool-name: carparts-pool

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # Seed credentials for V6, which runs on every start-up. Kept out of version control
    # — see .env.example. No defaults on purpose: an unset variable must fail the
    # migration, never quietly create an account with a password somebody could read
    # off the repository.
    placeholders:
      seed_admin_password_hash: ${SEED_ADMIN_PASSWORD_HASH}
      seed_staff_password_hash: ${SEED_STAFF_PASSWORD_HASH}

server:
  port: 8080
  error:
    include-message: always

security:
  jwt:
    secret: ${JWT_SECRET}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}

springdoc:
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.flywaydb: info
