name: CI

# Runs on every push to main and every pull request. Until this existed, seventeen pull
# requests were merged with nothing verifying them: the tests only ran when somebody
# remembered to type ./mvnw verify.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A second push to the same branch cancels the first — there is no value in finishing a run
  # for a commit that has already been replaced.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # No services: block and no secrets. The tests start their own PostgreSQL through
      # Zonky, whose BOM ships binaries for linux-amd64 as well as Windows and macOS, and
      # application-test.yml supplies the JWT secret and the seed password digests. That
      # keeps this file honest — anything it needed to inject would be a thing a developer
      # also has to know, and there is nothing.
      - name: Build, test and check coverage
        run: ./mvnw -B --no-transfer-progress verify

      - name: Coverage summary
        if: always()
        run: |
          report=target/site/jacoco/jacoco.csv
          if [ ! -f "$report" ]; then echo "no coverage report produced"; exit 0; fi
          awk -F, 'NR>1 {miss+=$4; cov+=$5} END {
            printf "## Coverage\n\n**%.1f%%** of instructions (%d of %d)\n", \
                   cov*100/(miss+cov), cov, miss+cov }' "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 14
